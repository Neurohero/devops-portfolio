# Стек расследования нагрузки на PostgreSQL:
#   target     — наблюдаемая БД (в проде — ваш сервер, здесь демо-инстанс)
#   repository — отдельная БД под историю: pg_profile (профили нагрузки по
#                интервалам) + TimescaleDB (история ожиданий блокировок)
#   collector  — по расписанию снимает снимки и срезы блокировок
#   grafana    — дашборд по блокировкам и тяжёлым запросам
# Наблюдаемую БД стек только читает: под ролью с pg_monitor, без суперюзера.

services:
  target:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PROFILER_PASSWORD: ${PROFILER_PASSWORD}
    volumes:
      - target-data:/var/lib/postgresql/data
      - ./target/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "app"]
      interval: 5s
      retries: 20

  repository:
    build: ./repository
    environment:
      POSTGRES_DB: diag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PROFILER_PASSWORD: ${PROFILER_PASSWORD}
    volumes:
      - repository-data:/var/lib/postgresql/data
    depends_on:
      target:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "diag"]
      interval: 5s
      retries: 30

  collector:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/collect.sh"]
    environment:
      PGHOST: repository
      PGUSER: postgres
      PGDATABASE: diag
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SAMPLE_INTERVAL_SEC: ${SAMPLE_INTERVAL_SEC:-900}
      LOCKS_INTERVAL_SEC: ${LOCKS_INTERVAL_SEC:-15}
    volumes:
      - ./collector/collect.sh:/collect.sh:ro
    depends_on:
      repository:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.3.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PROFILER_PASSWORD: ${PROFILER_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      repository:
        condition: service_healthy

  # Демо-нагрузка на target: docker compose --profile demo up -d
  demo-load:
    image: postgres:16-alpine
    profiles: ["demo"]
    environment:
      PGHOST: target
      PGUSER: postgres
      PGDATABASE: app
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - pgbench -i -s 5 && while true; do pgbench -c 4 -j 2 -T 300 -n; done
    depends_on:
      target:
        condition: service_healthy

volumes:
  target-data:
  repository-data:
  grafana-data:
